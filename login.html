<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - AutoParts Pro</title>
    <!-- Favicon / Browser Tab Save Icon -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="shortcut icon" type="image/png" href="assets/images/favicon.png">
    <link rel="apple-touch-icon" href="assets/images/favicon.png">
    <meta name="description" content="Log in to your AutoParts Pro customer account to view past orders, saved vehicles, and trade pricing.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { red: '#DC2626', dark: '#0F172A', accent: '#2563EB', amber: '#D97706', slate: '#1E293B' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 antialiased selection:bg-red-600 selection:text-white transition-colors">

    <div class="w-full max-w-md bg-white dark:bg-slate-800 p-8 rounded-3xl border border-slate-200/80 dark:border-slate-700 shadow-2xl space-y-6">

        <!-- Auth Notice Banner for Checkout Protection -->
        <div id="login-auth-notice" class="hidden bg-amber-500/10 border border-amber-500/30 text-amber-600 dark:text-amber-400 p-3.5 rounded-2xl text-xs font-bold flex items-center gap-2.5 shadow-sm">
            <i class="fa-solid fa-lock text-sm text-amber-500 flex-shrink-0"></i>
            <span>Please log in to your account or register to complete your order checkout.</span>
        </div>

        <div class="text-center space-y-2">
            <a href="index.html" dir="ltr" class="header-logo inline-flex items-center gap-2 group mb-2">
                <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center text-white text-xl font-black shadow-md shadow-red-600/30"><i class="fa-solid fa-gears"></i></div>
                <div class="text-xl font-black text-slate-900 dark:text-white">AUTO<span class="text-red-600">PARTS</span> PRO</div>
            </a>
            <h1 class="text-2xl font-black text-slate-900 dark:text-white">Customer Sign In</h1>
            <p class="text-xs text-slate-500"><bdi>Access your saved vehicles, order history, and trade account discounts.</bdi></p>
        </div>

        <!-- Social Sign-in Options (Google & Apple) -->
        <div class="space-y-2.5">
            <!-- Google Sign-in Button -->
            <button type="button" onclick="handleSocialLogin('Google')" class="w-full py-3 px-4 bg-white dark:bg-slate-700 hover:bg-slate-50 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-600 rounded-xl font-bold text-xs flex items-center justify-center gap-3 transition-all shadow-sm hover:shadow active:scale-[0.99] group">
                <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Sign in with Google</span>
            </button>

            <!-- Apple Sign-in Button -->
            <button type="button" onclick="handleSocialLogin('Apple')" class="w-full py-3 px-4 bg-black hover:bg-neutral-900 text-white dark:bg-white dark:text-black dark:hover:bg-slate-200 border border-black dark:border-white rounded-xl font-bold text-xs flex items-center justify-center gap-3 transition-all shadow-sm hover:shadow active:scale-[0.99] group">
                <i class="fa-brands fa-apple text-base mb-0.5 flex-shrink-0"></i>
                <span>Sign in with Apple</span>
            </button>
        </div>

        <!-- Divider -->
        <div class="relative flex items-center justify-center my-1">
            <div class="border-t border-slate-200 dark:border-slate-700 w-full"></div>
            <span class="bg-white dark:bg-slate-800 px-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider absolute">or with email</span>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
                <input type="email" id="login-email" required value="alex.morgan@workshop-solutions.com" dir="ltr" class="w-full bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl px-4 py-3 text-xs font-semibold focus:ring-2 focus:ring-red-600 focus:outline-none text-start">
            </div>

            <div>
                <div class="flex justify-between text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">
                    <span>Password</span>
                    <button type="button" onclick="AutoPartsUI.showToast('Demo password reset link sent to your email!', 'info')" class="text-red-600 hover:underline"><bdi>Forgot?</bdi></button>
                </div>
                <div class="relative">
                    <input type="password" id="login-pwd" required value="password123" dir="ltr" class="w-full bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl px-4 py-3 text-xs font-semibold focus:ring-2 focus:ring-red-600 focus:outline-none pr-10 text-start">
                    <button type="button" onclick="const p=document.getElementById('login-pwd'); const icon=this.querySelector('i'); p.type = p.type==='password'?'text':'password'; icon.classList.toggle('fa-eye'); icon.classList.toggle('fa-eye-slash');" class="absolute inset-y-0 right-0 px-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors" title="Toggle password visibility">
                        <i class="fa-solid fa-eye text-xs"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" id="login-remember" checked class="w-4 h-4 rounded">
                <label for="login-remember" class="text-xs font-semibold text-slate-600 dark:text-slate-400">Remember session on this device</label>
            </div>

            <button type="submit" class="w-full py-3.5 bg-red-600 hover:bg-red-700 text-white font-black text-xs uppercase tracking-wider rounded-xl shadow-lg shadow-red-600/30 transition-all">
                Sign In with Email
            </button>
        </form>

        <div class="text-center text-xs text-slate-500 pt-3 border-t border-slate-100 dark:border-slate-700 space-y-1">
            <div><bdi>Don't have an account?</bdi></div>
            <div><a href="register.html" class="font-bold text-red-600 dark:text-red-400 hover:underline"><bdi>Register</bdi></a></div>
        </div>
    </div>

    <script src="assets/js/products-data.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const redirect = urlParams.get('redirect');
            if (redirect === 'checkout.html') {
                const notice = document.getElementById('login-auth-notice');
                if (notice) notice.classList.remove('hidden');
                
                // Update link to register page to preserve redirect
                const regLink = document.querySelector('a[href="register.html"]');
                if (regLink) regLink.href = 'register.html?redirect=checkout.html';
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            window.AutoPartsStore.saveUser({
                id: "usr_99812",
                name: "Alex Morgan",
                email: email,
                accountType: "Workshop Account",
                companyName: "Morgan & Sons Auto Repair",
                isLoggedIn: true
            });
            const redirectTarget = new URLSearchParams(window.location.search).get('redirect') || 'account.html';
            window.location.href = redirectTarget;
        }

        function handleSocialLogin(provider) {
            const isGoogle = provider === 'Google';
            const email = isGoogle ? 'alex.morgan@gmail.com' : 'alex.morgan@icloud.com';
            const name = isGoogle ? 'Alex Morgan' : 'Alex Morgan';

            if (window.AutoPartsUI && window.AutoPartsUI.showToast) {
                window.AutoPartsUI.showToast(`Authenticating with ${provider}...`, 'info');
            }
            
            setTimeout(() => {
                window.AutoPartsStore.saveUser({
                    id: `usr_${provider.toLowerCase()}_${Math.floor(1000 + Math.random() * 9000)}`,
                    name: name,
                    email: email,
                    accountType: "Verified Trade Customer",
                    companyName: "Morgan & Sons Auto Repair",
                    provider: provider,
                    isLoggedIn: true
                });
                if (window.AutoPartsUI && window.AutoPartsUI.showToast) {
                    window.AutoPartsUI.showToast(`Signed in successfully with ${provider}!`, 'success');
                }
                setTimeout(() => {
                    const redirectTarget = new URLSearchParams(window.location.search).get('redirect') || 'account.html';
                    window.location.href = redirectTarget;
                }, 300);
            }, 500);
        }
    </script>
</body>
</html>
