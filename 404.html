<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - SKU Not Found | AutoParts Pro</title>
    <!-- Favicon / Browser Tab Save Icon -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="shortcut icon" type="image/png" href="assets/images/favicon.png">
    <link rel="apple-touch-icon" href="assets/images/favicon.png">
    <meta name="description" content="The requested spare part page or SKU could not be found. Use our search bar or vehicle compatibility finder.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { red: '#DC2626', dark: '#0F172A', accent: '#2563EB', amber: '#D97706', slate: '#1E293B' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 antialiased">

    <div class="max-w-xl w-full text-center space-y-6">
        
        <div class="relative mx-auto w-32 h-32 bg-red-100 dark:bg-red-950/60 text-red-600 rounded-full flex items-center justify-center text-6xl shadow-xl border-4 border-red-600/20">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <div class="space-y-2">
            <span class="text-xs font-black uppercase tracking-widest text-red-600 dark:text-red-400">Error 404 — SKU / Page Not Found</span>
            <h1 class="text-4xl sm:text-5xl font-black text-slate-900 dark:text-white tracking-tight">Wrong Turn on the Track</h1>
            <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 max-w-md mx-auto">
                The part schematic or URL you are looking for has been superseded, moved, or deleted from our active warehouse catalog.
            </p>
        </div>

        <!-- Quick Search Bar -->
        <div class="relative max-w-md mx-auto">
            <input type="text" placeholder="Search catalog by part name or SKU number..." class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-2xl py-3 ps-10 pe-24 text-xs font-semibold focus:ring-2 focus:ring-red-600 focus:outline-none shadow-md">
            <div class="absolute inset-y-0 left-0 ps-3.5 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <button type="button" onclick="const q = this.parentElement.querySelector('input')?.value; if(q) window.location.href='products.html?search='+encodeURIComponent(q);" class="absolute inset-y-1 right-1 px-4 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold transition-colors">
                Search
            </button>
        </div>

        <div class="flex flex-wrap items-center justify-center gap-3 pt-4">
            <a href="index.html" class="px-6 py-3 bg-slate-900 dark:bg-slate-800 hover:bg-slate-800 text-white font-bold text-xs rounded-xl transition-colors">
                <i class="fa-solid fa-house me-1.5"></i> Back to Home
            </a>
            <a href="compatibility-finder.html" class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-red-600/30 transition-colors">
                <i class="fa-solid fa-car me-1.5"></i> Compatibility Finder
            </a>
            <button type="button" onclick="AutoPartsUI.toggleTheme()" class="w-10 h-10 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 rounded-xl transition-colors flex items-center justify-center" title="Toggle Dark/Light Theme" aria-label="Toggle Dark/Light Theme">
                <i class="fa-solid fa-moon dark:hidden text-amber-500 text-sm"></i>
                <i class="fa-solid fa-sun hidden dark:inline text-amber-400 text-sm"></i>
            </button>
            <button type="button" onclick="AutoPartsUI.toggleRTL()" class="w-10 h-10 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 rounded-xl transition-colors flex items-center justify-center" title="Toggle LTR/RTL Layout" aria-label="Toggle LTR/RTL Layout">
                <i class="fa-solid fa-right-left text-blue-500 text-xs"></i>
            </button>
        </div>

    </div>

    <!-- Scripts -->
    <script src="assets/js/store.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
